<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#14161b">
  <meta name="description" content="Créez vos itinéraires moto, vélo et running : type de route par tronçon, dénivelé, difficultés, import et export GPX. Gratuit.">
  <title>Trajecto — itinéraires moto, vélo, running</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314161b'/%3E%3Cpath d='M14 46c10 0 8-22 18-22s8 14 18 14' fill='none' stroke='%23ff4d00' stroke-width='7' stroke-linecap='round'/%3E%3Ccircle cx='14' cy='46' r='6' fill='%23fff'/%3E%3Ccircle cx='50' cy='38' r='6' fill='%23f5c400'/%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <div id="map" aria-label="Carte"></div>

  <header class="topbar">
    <a class="brand" href="./" aria-label="Trajecto">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#14161b"/><path d="M14 46c10 0 8-22 18-22s8 14 18 14" fill="none" stroke="var(--accent)" stroke-width="7" stroke-linecap="round"/><circle cx="14" cy="46" r="6" fill="#fff"/><circle cx="50" cy="38" r="6" fill="#f5c400"/></svg>
      <span>Trajecto</span>
    </a>
    <div class="search">
      <input id="q" type="search" placeholder="Rechercher un lieu…" autocomplete="off" aria-label="Rechercher un lieu">
      <ul id="q-results" hidden></ul>
    </div>
    <div class="modes" role="group" aria-label="Activité">
      <button data-mode="moto" data-icon="moto" aria-pressed="true"><span>Moto</span></button>
      <button data-mode="velo" data-icon="velo" aria-pressed="false"><span>Vélo</span></button>
      <button data-mode="run" data-icon="run" aria-pressed="false"><span>Running</span></button>
    </div>
  </header>

  <div class="tools" role="toolbar" aria-label="Outils de carte">
    <button class="tool" data-act="undo" data-icon="undo" title="Annuler (Ctrl+Z)" aria-label="Annuler"></button>
    <button class="tool" data-act="redo" data-icon="redo" title="Rétablir (Ctrl+Y)" aria-label="Rétablir"></button>
    <button class="tool" data-act="fit" data-icon="fit" title="Voir tout le parcours" aria-label="Voir tout le parcours"></button>
    <button class="tool" id="tool-append" data-act="append" data-icon="append" title="Ajouter à la fin : chaque clic ajoute un point au bout du parcours, même sur le tracé" aria-label="Mode ajout à la fin" aria-pressed="false"></button>
    <button class="tool" id="tool-slope" data-act="slope" data-icon="slope" title="Colorer selon la pente" aria-label="Colorer selon la pente" aria-pressed="false"></button>
    <button class="tool" data-act="style" data-icon="layers" title="Changer de fond de carte" aria-label="Changer de fond de carte"></button>
    <button class="tool" data-act="locate" data-icon="locate" title="Me localiser" aria-label="Me localiser"></button>
  </div>
  <div id="slope-legend" class="slope-legend" hidden></div>

  <aside id="panel" class="panel" aria-label="Parcours">
    <button class="sheet-handle" data-act="sheet" aria-label="Agrandir ou réduire le panneau"><i></i></button>
    <div class="panel-head">
      <input id="route-name" value="Mon parcours" aria-label="Nom du parcours" maxlength="60">
    </div>
    <div class="panel-body">
      <section id="summary"></section>
      <section id="profile" class="profile is-empty">
        <canvas aria-label="Profil altimétrique"></canvas>
        <div class="profile-tip" hidden></div>
      </section>
      <section id="alerts"></section>
      <section id="weather"></section>
      <section id="pois"></section>
      <section id="composition"></section>
      <section id="legs"></section>
    </div>
    <nav class="actions">
      <button class="btn" data-act="import" data-icon="upload"><span>Importer</span></button>
      <button class="btn" data-act="share" data-icon="link"><span>Partager</span></button>
      <button class="btn btn-primary" data-act="export" data-icon="download"><span>Exporter GPX</span></button>
      <button class="icon-btn btn-more" data-act="more" data-icon="more" aria-label="Plus d’options"></button>
    </nav>
  </aside>

  <div id="toasts" aria-live="polite"></div>
  <div id="drop-zone"><div>Déposez vos fichiers GPX, KML ou GeoJSON</div></div>
</div>
<input type="file" id="file-input" multiple accept=".gpx,.kml,.geojson,.json,application/gpx+xml" hidden>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="js/config.js"></script>
<script src="js/core/util.js"></script>
<script src="js/core/hooks.js"></script>
<script src="js/core/analysis.js"></script>
<script src="js/core/store.js"></script>
<script src="js/core/engine.js"></script>
<script src="js/providers/routing-valhalla.js"></script>
<script src="js/providers/elevation-terrain.js"></script>
<script src="js/providers/geocode-photon.js"></script>
<script src="js/providers/poi-overpass.js"></script>
<script src="js/providers/weather-openmeteo.js"></script>
<script src="js/io/import.js"></script>
<script src="js/io/export.js"></script>
<script src="js/ui/icons.js"></script>
<script src="js/ui/ui.js"></script>
<script src="js/ui/panel.js"></script>
<script src="js/ui/map.js"></script>
<script src="js/ui/profile.js"></script>
<script src="js/features/score.js"></script>
<script src="js/features/poi.js"></script>
<script src="js/features/weather.js"></script>
<script src="js/features/share.js"></script>
<script src="js/features/loop.js"></script>
<script src="js/features/roadbook.js"></script>
<script src="js/app.js"></script>
</body>
</html>
